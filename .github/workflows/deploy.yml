name: deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      firstmate_ref:
        description: "Firstmate branch or SHA (build arg FIRSTMATE_REF)"
        default: main
        required: false
  repository_dispatch:
    types: [ deploy ]

concurrency:
  group: deploy-opencode-sandbox
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Sync deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: ${{ secrets.TENCENT_USER }}
          key: ${{ secrets.TENCENT_SSH_KEY }}
          source: "Dockerfile,docker-compose.yml,docker-compose.vps.yml,proxy/,config/,env/,scripts/,cloudflared/"
          target: /opt/opencode-sandbox

      - name: Render runtime env from GitHub secrets
        uses: appleboy/ssh-action@v1.0.3
        env:
          OPENCODE_DOMAIN: ${{ secrets.OPENCODE_DOMAIN }}
          CLOUDFLARED_TOKEN: ${{ secrets.CLOUDFLARED_TOKEN }}
          OPENCODE_SERVER_PASSWORD: ${{ secrets.OPENCODE_SERVER_PASSWORD }}
          ROUTER9_GATEWAY_KEY: ${{ secrets.ROUTER9_GATEWAY_KEY }}
          ROUTER9_API_KEY: ${{ secrets.ROUTER9_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: ${{ secrets.TENCENT_USER }}
          key: ${{ secrets.TENCENT_SSH_KEY }}
          envs: OPENCODE_DOMAIN,CLOUDFLARED_TOKEN,OPENCODE_SERVER_PASSWORD,ROUTER9_GATEWAY_KEY,ROUTER9_API_KEY,GH_TOKEN,GITLAB_TOKEN
          script: |
            set -e
            cd /opt/opencode-sandbox

            # Deployment-level env (compose interpolation): domain + tunnel token.
            cat > .env <<EOF
            OPENCODE_DOMAIN=${OPENCODE_DOMAIN:-opencode.example.com}
            OPENCODE_PORT=4096
            CLOUDFLARED_TOKEN=${CLOUDFLARED_TOKEN}
            ROUTER9_GATEWAY_URL=http://9router-api:20127
            ROUTER9_GATEWAY_KEY=${ROUTER9_GATEWAY_KEY}
            EOF
            chmod 600 .env

            # Container runtime env (env_file for the opencode service).
            cat > env/opencode.env <<EOF
            OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD}
            OPENCODE_SERVER_USERNAME=opencode
            ROUTER9_GATEWAY_URL=http://9router-api:20127
            ROUTER9_GATEWAY_KEY=${ROUTER9_GATEWAY_KEY}
            ROUTER9_API_KEY=${ROUTER9_API_KEY}
            GH_TOKEN=${GH_TOKEN}
            GITLAB_TOKEN=${GITLAB_TOKEN}
            FM_HOME=/home/opencode
            FIRSTMATE_HOME=/home/opencode/.firstmate
            EOF
            chmod 600 env/opencode.env

            echo "Rendered .env and env/opencode.env from GitHub secrets"

      - name: Build new image
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: ${{ secrets.TENCENT_USER }}
          key: ${{ secrets.TENCENT_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/opencode-sandbox

            test -f env/opencode.env || {
              echo "ERROR: env/opencode.env missing on VPS (rendered from GitHub secrets)"
              exit 1
            }

            FIRSTMATE_TARGET="${{ github.event.inputs.firstmate_ref }}"
            FIRSTMATE_TARGET="${FIRSTMATE_TARGET:-main}"

            # Resolve the image name from compose instead of hardcoding it.
            IMAGE=$(docker compose -f docker-compose.yml -f docker-compose.vps.yml config --format json \
              | jq -r '.services.opencode.image // empty')
            IMAGE="${IMAGE:-opencode-sandbox-opencode:latest}"
            echo "IMAGE=$IMAGE" > .deploy-env

            resolve_sha() {
              local ref="$1"
              if [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
                echo "$ref"
              else
                local sha
                sha=$(git ls-remote https://github.com/kunchenguid/firstmate "$ref" 2>/dev/null | awk '{print $1}')
                if [[ -z "$sha" ]]; then
                  echo "ERROR: cannot resolve firstmate ref '$ref'" >&2
                  exit 1
                fi
                echo "$sha"
              fi
            }
            FIRSTMATE_SHA=$(resolve_sha "$FIRSTMATE_TARGET")
            echo "Building image=$IMAGE firstmate=$FIRSTMATE_SHA"

            docker tag "$IMAGE" "${IMAGE%%:*}:prev" 2>/dev/null || true

            docker compose -f docker-compose.yml -f docker-compose.vps.yml build \
              --build-arg FIRSTMATE_REF=$FIRSTMATE_SHA \
              opencode

            docker image inspect "$IMAGE" >/dev/null

      - name: Smoke test new image
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: ${{ secrets.TENCENT_USER }}
          key: ${{ secrets.TENCENT_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/opencode-sandbox
            . ./.deploy-env

            SMOKE=smoke-opencode
            SMOKE_PORT=4097
            LOCAL_HOST="127.0.0.1"
            WEB_URL="http://${LOCAL_HOST}:${SMOKE_PORT}"

            # Reuse the 9router network when present so the sandbox can reach 9router-api:20127.
            NET=9router_9router-net
            if docker network inspect "$NET" >/dev/null 2>&1; then
              NETARG="--network $NET"
            else
              NETARG=""
            fi

            cleanup() {
              echo "Cleaning up smoke container..."
              docker rm -f "$SMOKE" >/dev/null 2>&1 || true
            }
            trap cleanup EXIT

            docker rm -f "$SMOKE" >/dev/null 2>&1 || true

            # Mirror prod: bind dirs must be writable by uid 1000 for the entrypoint seed
            mkdir -p data/{projects,data,state,config,scratchpad,sessions,ssh}
            chown -R 1000:1000 data

            docker run -d --name "$SMOKE" $NETARG \
              --env-file ./env/opencode.env \
              -p ${SMOKE_PORT}:4096 \
              -v "$(pwd)/data/projects:/home/opencode/projects" \
              -v "$(pwd)/data/data:/home/opencode/data" \
              -v "$(pwd)/data/state:/home/opencode/state" \
              -v "$(pwd)/data/config:/home/opencode/config" \
              -v "$(pwd)/data/scratchpad:/home/opencode/scratchpad" \
              -v "$(pwd)/data/sessions:/home/opencode/sessions" \
              -v "$(pwd)/data/ssh:/home/opencode/.ssh:ro" \
              "$IMAGE"

            echo "Waiting for smoke container to boot..."
            sleep 5

            test "$(docker inspect -f '{{.State.Running}}' $SMOKE)" = "true" || {
              echo "ERROR: smoke container is not running"
              docker logs --tail=100 "$SMOKE" || true
              exit 1
            }

            echo "Checking gh auth (GH_TOKEN)..."
            docker exec "$SMOKE" gh auth status || {
              echo "ERROR: gh auth status failed"
              exit 1
            }

            echo "Checking tmux sessions..."
            docker exec "$SMOKE" sh -c 'tmux ls || tmux has-session' || {
              echo "ERROR: no tmux session/server in container"
              exit 1
            }

            echo "Checking opencode web process..."
            docker exec "$SMOKE" sh -c 'pgrep -f "opencode web" >/dev/null' || {
              echo "ERROR: opencode web process not found"
              docker logs --tail=100 "$SMOKE" || true
              exit 1
            }

            echo "Checking firstmate config seeded..."
            docker exec "$SMOKE" test -s /home/opencode/config/crew-harness || {
              echo "ERROR: firstmate config not seeded (check data dir ownership)"
              docker exec "$SMOKE" ls -lan /home/opencode/config || true
              exit 1
            }

            echo "Awaiting opencode web at ${WEB_URL}..."
            CODE=""
            for i in $(seq 1 20); do
              CODE=$(curl -s --connect-timeout 3 --max-time 10 -o /dev/null -w '%{http_code}' "$WEB_URL" || true)
              if [ "$CODE" = "200" ] || [ "$CODE" = "401" ]; then
                break
              fi
              sleep 3
            done

            if [ "$CODE" != "200" ] && [ "$CODE" != "401" ]; then
              echo "ERROR: opencode web smoke test failed (http_code=$CODE)"
              docker logs --tail=100 "$SMOKE" || true
              exit 1
            fi

            echo "SMOKE TEST PASSED (http_code=$CODE)"

      - name: Switch to new image & verify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: ${{ secrets.TENCENT_USER }}
          key: ${{ secrets.TENCENT_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/opencode-sandbox

            docker rm -f smoke-opencode >/dev/null 2>&1 || true

            # Bind-mounted data dirs must be writable by uid 1000 (container user)
            echo "Ensuring data dirs owned by uid 1000..."
            mkdir -p data/{projects,data,state,config,scratchpad,sessions,ssh}
            chown -R 1000:1000 data

            echo "Starting production stack..."
            docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d \
              --remove-orphans \
              --force-recreate

            docker compose -f docker-compose.yml -f docker-compose.vps.yml ps

            for c in opencode opencode-caddy opencode-cloudflared; do
              test "$(docker inspect -f '{{.State.Running}}' $c)" = "true" || {
                echo "ERROR: $c is not running"
                docker logs --tail=100 "$c" || true
                exit 1
              }
            done

            echo "Waiting for production opencode web..."
            CODE=""
            for i in $(seq 1 20); do
              CODE=$(docker exec opencode curl -s --connect-timeout 3 --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:4096 || true)
              if [ "$CODE" = "200" ] || [ "$CODE" = "401" ]; then
                break
              fi
              sleep 3
            done

            if [ "$CODE" != "200" ] && [ "$CODE" != "401" ]; then
              echo "ERROR: production opencode web health check failed (http_code=$CODE)"
              docker logs --tail=100 opencode || true
              exit 1
            fi

            echo "DEPLOY OK"

      - name: Prune old images & build cache
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: ${{ secrets.TENCENT_USER }}
          key: ${{ secrets.TENCENT_SSH_KEY }}
          script: |
            cd /opt/opencode-sandbox
            PROJECT=opencode-sandbox
            if [ -f .deploy-env ]; then
              . ./.deploy-env
              # Scoped to this project's own image ref — safe on a shared daemon.
              docker rmi "${IMAGE%%:*}:prev" 2>/dev/null || true
            fi
            # Scope image cleanup to this compose project (label filter) and keep
            # a 24h age floor so a concurrent build's fresh dangling layers (e.g.
            # the co-located 9router stack) are never collected here.
            docker image prune -f \
              --filter "label=com.docker.compose.project=$PROJECT" \
              --filter "until=24h"
            # NEVER `docker builder prune -af` on a shared VPS: it wipes the
            # BuildKit cache of every project on the daemon. Only drop cache
            # older than 7 days instead.
            docker builder prune -f --filter "until=168h"

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: ${{ secrets.TENCENT_USER }}
          key: ${{ secrets.TENCENT_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/opencode-sandbox
            echo "Deployment failed — restoring previous image..."
            docker rm -f smoke-opencode >/dev/null 2>&1 || true

            # Failure before the build step produced a new image — production is
            # untouched, so don't needlessly recreate (and blip the ingress).
            if [ ! -f .deploy-env ]; then
              echo "No .deploy-env — failure before build; production left as-is."
              exit 0
            fi
            . ./.deploy-env

            PREV="${IMAGE%%:*}:prev"
            CUR_ID=$(docker image inspect "$IMAGE" --format '{{.Id}}' 2>/dev/null || true)
            PREV_ID=$(docker image inspect "$PREV" --format '{{.Id}}' 2>/dev/null || true)
            NEED_RECREATE=0

            if [ -n "$PREV_ID" ] && [ "$CUR_ID" != "$PREV_ID" ]; then
              echo "Restoring $PREV -> $IMAGE"
              docker tag "$PREV" "$IMAGE"
              NEED_RECREATE=1
            fi

            if [ "$NEED_RECREATE" = "1" ]; then
              docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d \
                --remove-orphans --force-recreate || {
                  echo "ERROR: rollback recreate failed"
                  docker compose -f docker-compose.yml -f docker-compose.vps.yml ps || true
                  exit 1
                }
              docker compose -f docker-compose.yml -f docker-compose.vps.yml ps
              echo "ROLLBACK OK"
            else
              echo "Production already on the previous image; nothing to roll back."
            fi
